<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Forgot Password</h2>
            <p>Enter your email to receive a password reset link</p>
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" id="email" formControlName="email"
                        [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" placeholder="Enter your email" />
                </div>
                <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                    <div *ngIf="f['email'].errors['required']">Email is required</div>
                    <div *ngIf="f['email'].errors['email']">Email must be a valid email address</div>
                </div>
            </div>

            <div *ngIf="errorMessage" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
            </div>

            <div *ngIf="successMessage" class="alert alert-success">
                <i class="fas fa-check-circle"></i> {{ successMessage }}
            </div>

            <button type="submit" [disabled]="loading" class="btn-primary">
                <i class="fas fa-spinner fa-spin" *ngIf="loading"></i>
                <span *ngIf="!loading">Send Reset Link</span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Remember your password? <a routerLink="/login" class="text-link">Back to login</a></p>
        </div>
    </div>
</div>
