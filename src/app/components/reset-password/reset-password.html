<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Reset Password</h2>
            <p>Enter a new password for your account.</p>
        </div>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!successMessage && token">
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="password" formControlName="password"
                        [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
                        placeholder="Enter new password" />
                </div>
                <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                    <div *ngIf="f['password'].errors['required']">Password is required</div>
                    <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="confirmPassword" formControlName="confirmPassword"
                        [ngClass]="{ 'is-invalid': submitted && f['confirmPassword'].errors }"
                        placeholder="Confirm new password" />
                </div>
                <div *ngIf="submitted && f['confirmPassword'].errors" class="invalid-feedback">
                    <div *ngIf="f['confirmPassword'].errors['required']">Confirm Password is required</div>
                    <div *ngIf="f['confirmPassword'].errors['mustMatch']">Passwords must match</div>
                </div>
            </div>

            <div *ngIf="errorMessage" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
            </div>

            <button type="submit" [disabled]="loading" class="btn-primary">
                <i class="fas fa-spinner fa-spin" *ngIf="loading"></i>
                <span *ngIf="!loading">Reset Password</span>
            </button>
        </form>

        <div *ngIf="successMessage" class="alert alert-success mt-4">
            <i class="fas fa-check-circle"></i> {{ successMessage }}
            <p class="mt-2 text-sm">Redirecting to login...</p>
        </div>

        <div *ngIf="!token && !successMessage" class="alert alert-error mt-4">
            <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
        </div>

        <div class="auth-footer">
            <p><a routerLink="/login" class="text-link">Back to login</a></p>
        </div>
    </div>
</div>
